name: Vercel production checkpoint

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  trigger-vercel:
    if: contains(github.event.head_commit.message, '[vercel-hook]')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Pre-deploy quality gate
        run: npm run test:quality

      # Official production path: GitHub Actions -> Vercel Deploy Hook.
      # ChatGPT's Vercel connector is intentionally not required.
      - name: Trigger latest main deployment
        env:
          VERCEL_DEPLOY_HOOK_URL: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}
        run: |
          test -n "$VERCEL_DEPLOY_HOOK_URL"
          curl --fail-with-body --silent --show-error -X POST "$VERCEL_DEPLOY_HOOK_URL"

      - name: Verify production after deploy
        run: npm run test:smoke -- --url https://terra-z.vercel.app/ --api --expected-sha "$GITHUB_SHA" --wait 900
