name: Terra Z dev smoke

on:
  push:
    branches:
      - dev
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: terra-z-dev-smoke
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Start local static server
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/terra-z-http.log 2>&1 &
          echo $! > /tmp/terra-z-http.pid
          sleep 1

      - name: Run static smoke test
        run: npm run test:smoke -- --url http://127.0.0.1:4173/

      - name: Stop local static server
        if: always()
        run: |
          if [ -f /tmp/terra-z-http.pid ]; then
            kill "$(cat /tmp/terra-z-http.pid)" || true
          fi
