name: Terra Z quality gate

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: terra-z-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Preflight
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Run quality gate
        run: npm run test:quality
