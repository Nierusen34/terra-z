name: GitHub Pages smoke test

on:
  page_build:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: terra-z-pages-smoke
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4

      - name: Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Wait for GitHub Pages and run smoke test
        run: npm run test:smoke -- --url https://nierusen34.github.io/terra-z/ --wait 180
